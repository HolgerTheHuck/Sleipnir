name: Build, Test & Pack

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger for the npm publish job only (e.g. the initial npm publish
  # of sleipnir-client / sleipnir-codegen, or a re-publish at a fixed version).
  # The NuGet pack job stays tag-gated and will not run on dispatch.
  workflow_dispatch:
    inputs:
      version:
        description: 'npm version to publish (e.g. 1.1.1)'
        required: true
        default: '1.1.1'

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Sleipnir.sln

      - name: Build
        run: dotnet build Sleipnir.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SleipnirTests/SleipnirTests.csproj --configuration Release --no-build --verbosity normal

      - name: Check formatting
        run: dotnet format Sleipnir.sln --verify-no-changes --severity warn

      - name: Check vulnerable packages
        run: dotnet list Sleipnir.sln package --vulnerable

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    # contents: write lets the default GITHUB_TOKEN create the GitHub Release;
    # pull-requests: write is needed by generate_release_notes to label PR notes.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Sleipnir.sln

      - name: Determine version
        id: ver
        # Tags heißen v1.0.0; NuGet lehnt ein führendes 'v' ab → abschneiden.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: |
          dotnet pack SleipnirCommon/SleipnirCommon.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirCore/SleipnirCore.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirHub/SleipnirHub.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirRest/SleipnirRest.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirWebSocket/SleipnirWebSocket.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirClient/SleipnirClient.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirDeveloperUi/SleipnirDeveloperUi.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirServer/SleipnirServer.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirTelemetry/SleipnirTelemetry.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          # .NET-native codegen trio (discovery JSON = standard contract): Roslyn source generator + server-side export/drift-check.
          dotnet pack Sleipnir.SourceGenerator/Sleipnir.SourceGenerator.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack Sleipnir.Server.Codegen/Sleipnir.Server.Codegen.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          # Typed LINQ client pair: runtime Dep<T>/SleipnirQuery<T> façade + the sleipnir-linq dotnet tool that generates contracts.
          dotnet pack Sleipnir.Client.Linq/Sleipnir.Client.Linq.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack Sleipnir.Client.Linq.Codegen/Sleipnir.Client.Linq.Codegen.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}

      - name: Publish to NuGet
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish symbol packages
        run: dotnet nuget push "**/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.nupkg
            **/*.snupkg

  publish-npm:
    # Publishes the isomorphic TS/JS client (sleipnir-client) and the typed stub
    # generator (sleipnir-codegen) to npm. Tag-driven like the NuGet pack job, plus
    # a workflow_dispatch path for the initial publish / fixed-version re-publish.
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url + NODE_AUTH_TOKEN (set on each `npm publish` step) is the
          # setup-node convention for publishing to the npm registry.
          registry-url: 'https://registry.npmjs.org'

      - name: Determine version
        id: ver
        # Tags are v1.1.1; npm rejects a leading 'v' → strip it. On dispatch, use
        # the explicit input version (default 1.1.1) so the first npm publish can
        # land in lockstep with the NuGet 1.1.1 release without a new tag.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & publish sleipnir-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd clients/ts
          npm ci --no-audit --no-fund
          # Stamp the release version (tag or dispatch input); idempotent when it
          # already matches package.json, and authoritative for future tag releases.
          npm version "${{ steps.ver.outputs.VERSION }}" --no-git-tag-version --allow-same-version
          # prepublishOnly runs `npm run build` before the tarball is packed.
          npm publish --access public

      - name: Build, rewrite dep & publish sleipnir-codegen
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd clients/codegen
          # npm ci resolves the local file:../ts dependency (now built above) for
          # the codegen tsc compile against the client's emitted .d.ts types.
          npm ci --no-audit --no-fund
          npm run build
          npm version "${{ steps.ver.outputs.VERSION }}" --no-git-tag-version --allow-same-version
          # Rewrite the local file: dependency to the published registry version,
          # so consumers resolve a real package instead of an invalid file: path.
          npm pkg set dependencies.sleipnir-client="^${{ steps.ver.outputs.VERSION }}"
          npm publish --access public