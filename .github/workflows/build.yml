name: Build, Test & Pack

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger for the npm publish job ONLY. npm publishing is deliberately
  # decoupled from NuGet `v*` tags: the two npm packages move at independent
  # versions (sleipnir-codegen can ship 1.2.1 while sleipnir-client stays at
  # 1.1.1), so a lockstep NuGet tag must NOT stamp them to the tag version
  # (that would regress sleipnir-codegen's `latest` below an already-shipped
  # independent release). On dispatch, each package publishes its committed
  # package.json version (no stamping); a skip-if-exists guard makes
  # re-dispatch idempotent. The NuGet pack job stays tag-gated and does not run
  # on dispatch.
  workflow_dispatch: ~

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    # Matrix: Linux is the primary leg (format/vulnerable/coverage checks run here only);
    # the Windows leg exists because development happens on Windows and several tests
    # carry Windows-specific timing assumptions (the reconnect tests' commentary) — a
    # green Ubuntu leg proves the suite passes on a runner the developers never sit at.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The suite spawns several `dotnet build` compile-gates (CsCodegenParityTests,
    # ts-compile) and WebApplicationFactory integration tests; on a slow/overloaded
    # shared runner these can push the test step well past 10 min. 15 min was too
    # tight (observed timeout-during-Test on an overloaded runner — the suite itself
    # finishes in ~3 min on a warm/healthy runner). 30 min gives headroom for a bad
    # runner day without masking a genuine hang indefinitely.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Sleipnir.sln

      - name: Build
        run: dotnet build Sleipnir.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SleipnirTests/SleipnirTests.csproj --configuration Release --no-build --verbosity normal

      # Coverage on one leg only — the matrix exists for platform coverage; collecting
      # twice doubles CI minutes for nothing. Coverlet is referenced but was never
      # exercised (08-08 audit R11.4); collect the XPlat DataCollector and upload the
      # cobertura/xml reports as a workflow artifact (no external service, no token).
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        run: >
          dotnet test SleipnirTests/SleipnirTests.csproj --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ubuntu
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Sleipnir.sln --verify-no-changes --severity warn

      - name: Check vulnerable packages (gating)
        if: matrix.os == 'ubuntu-latest'
        # `dotnet list --vulnerable` exits 0 even when vulnerable packages are found —
        # parse the output and fail the step. `--include-transitive` matters: the 08-08
        # audit noted a vulnerable chain behind an OK direct graph. English runner output
        # matches the report header; an empty match stays green.
        run: |
          dotnet list Sleipnir.sln package --vulnerable --include-transitive > vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            cat vuln-report.txt
            echo "::error::Vulnerable NuGet packages detected (direct + transitive)"
            exit 1
          fi
          echo "No vulnerable packages (direct + transitive)."

      - name: Clean up vuln report
        if: matrix.os == 'ubuntu-latest'
        run: rm -f vuln-report.txt

  ts-tests:
    # The TS side (clients/ts + clients/codegen) had NO test job: the .NET parity gate
    # compares committed golden fixtures against vitest-tested emitters, but the vitest
    # suites themselves never ran in CI — the TS side could drift with CI green. This
    # job runs typecheck + tests for both packages. Order matters: clients/ts dist/ must
    # be built before codegen's npm ci, which resolves the file:../ts dep and compiles
    # against the client's emitted .d.ts (TS2305 otherwise).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: sleipnir-client — install, build dist, typecheck, test
        run: |
          cd clients/ts
          npm ci --no-audit --no-fund
          npm run build
          npm run typecheck
          npm test

      - name: sleipnir-codegen — install, typecheck, test
        run: |
          cd clients/codegen
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  pack:
    runs-on: ubuntu-latest
    needs: [build-test, ts-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    # contents: write lets the default GITHUB_TOKEN create the GitHub Release;
    # pull-requests: write is needed by generate_release_notes to label PR notes.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Sleipnir.sln

      - name: Determine version
        id: ver
        # Tags heißen v1.0.0; NuGet lehnt ein führendes 'v' ab → abschneiden.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: |
          dotnet pack SleipnirCommon/SleipnirCommon.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirCore/SleipnirCore.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirHub/SleipnirHub.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirRest/SleipnirRest.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirWebSocket/SleipnirWebSocket.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirClient/SleipnirClient.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirDeveloperUi/SleipnirDeveloperUi.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirServer/SleipnirServer.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack SleipnirTelemetry/SleipnirTelemetry.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          # .NET-native codegen trio (discovery JSON = standard contract): Roslyn source generator + server-side export/drift-check.
          dotnet pack Sleipnir.SourceGenerator/Sleipnir.SourceGenerator.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack Sleipnir.Server.Codegen/Sleipnir.Server.Codegen.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          # Typed LINQ client pair: runtime Dep<T>/SleipnirQuery<T> façade + the sleipnir-linq dotnet tool that generates contracts.
          dotnet pack Sleipnir.Client.Linq/Sleipnir.Client.Linq.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack Sleipnir.Client.Linq.Codegen/Sleipnir.Client.Linq.Codegen.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}

      - name: Publish to NuGet
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish symbol packages
        run: dotnet nuget push "**/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.nupkg
            **/*.snupkg

  publish-npm:
    # Publishes the isomorphic TS/JS client (sleipnir-client) and the typed stub
    # generator (sleipnir-codegen) to npm. Dispatch-only (NOT tag-driven): the
    # two npm packages version independently of the NuGet lockstep, so a `v*`
    # tag must not stamp them to the tag version (it would regress an already-
    # shipped independent release below `latest`).
    #
    # Versioning: NO stamping — each package publishes its committed
    # package.json version, so the two can move independently (e.g. codegen
    # 1.2.1 while client stays at 1.1.1). codegen's file:../ts dep is rewritten
    # to ^<client-committed-version>.
    # A `npm view <pkg>@<ver>` guard skips a package that already exists on the
    # registry, so a re-dispatch (or a dispatch where only one package changed)
    # is idempotent and never 403s on a re-publish.
    runs-on: ubuntu-latest
    needs: [build-test, ts-tests]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # registry-url + NODE_AUTH_TOKEN (set on each `npm publish` step) is the
          # setup-node convention for publishing to the npm registry.
          registry-url: 'https://registry.npmjs.org'

      - name: Determine tag version
        id: ver
        # This job is dispatch-only (see `if:` above), so TAG_VERSION is always
        # empty → "publish committed versions, do not stamp". The tag branch is
        # retained as a cheap re-coupling point if npm is ever re-tied to NuGet.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_VERSION=""
          else
            TAG_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "TAG_VERSION=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build & publish sleipnir-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_1 }}
        run: |
          cd clients/ts
          npm ci --no-audit --no-fund
          # On a tag, stamp to the tag version; on dispatch, keep the committed version.
          if [ -n "${{ steps.ver.outputs.TAG_VERSION }}" ]; then
            npm version "${{ steps.ver.outputs.TAG_VERSION }}" --no-git-tag-version --allow-same-version
          fi
          # Always build dist/ — codegen's `npm ci` resolves the local file:../ts
          # dep (which has no prepare/prepack) by packing this directory, so the
          # emitted .d.ts must exist even when we skip the publish below.
          npm run build
          CLIENT_VERSION=$(node -p "require('./package.json').version")
          echo "client version: $CLIENT_VERSION"
          if npm view "sleipnir-client@$CLIENT_VERSION" version >/dev/null 2>&1; then
            echo "sleipnir-client@$CLIENT_VERSION already published — skipping publish."
          else
            # prepublishOnly re-runs `npm run build` before the tarball is packed.
            npm publish --access public
          fi
          # Export for the codegen step so its file: dep can be rewritten to the
          # exact published client version.
          echo "CLIENT_VERSION=$CLIENT_VERSION" >> "$GITHUB_ENV"

      - name: Build, rewrite dep & publish sleipnir-codegen
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_1 }}
        run: |
          cd clients/codegen
          # npm ci resolves the local file:../ts dependency (dist built above) for
          # the codegen tsc compile against the client's emitted .d.ts types.
          npm ci --no-audit --no-fund
          npm run build
          # On a tag, stamp to the tag version; on dispatch, keep the committed version.
          if [ -n "${{ steps.ver.outputs.TAG_VERSION }}" ]; then
            npm version "${{ steps.ver.outputs.TAG_VERSION }}" --no-git-tag-version --allow-same-version
          fi
          # Rewrite the local file: dependency to the published client version (the
          # version we just published / skipped, from clients/ts/package.json), so
          # consumers resolve a real registry package instead of an invalid file: path.
          npm pkg set dependencies.sleipnir-client="^${CLIENT_VERSION}"
          CODEGEN_VERSION=$(node -p "require('./package.json').version")
          echo "codegen version: $CODEGEN_VERSION"
          if npm view "sleipnir-codegen@$CODEGEN_VERSION" version >/dev/null 2>&1; then
            echo "sleipnir-codegen@$CODEGEN_VERSION already published — skipping publish."
          else
            npm publish --access public
          fi