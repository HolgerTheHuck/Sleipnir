name: Build, Test & Pack

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Trame.sln

      - name: Build
        run: dotnet build Trame.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TrameTests/TrameTests.csproj --configuration Release --no-build --verbosity normal

      - name: Check formatting
        run: dotnet format Trame.sln --verify-no-changes --severity warn

      - name: Check vulnerable packages
        run: dotnet list Trame.sln package --vulnerable

  pack:
    runs-on: ubuntu-latest
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Trame.sln

      - name: Determine version
        id: ver
        # Tags heißen v1.0.0; NuGet lehnt ein führendes 'v' ab → abschneiden.
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Pack NuGet packages
        run: |
          dotnet pack TrameCommon/TrameCommon.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameCore/TrameCore.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameHub/TrameHub.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameRest/TrameRest.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameWebSocket/TrameWebSocket.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameClient/TrameClient.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameDeveloperUi/TrameDeveloperUi.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameServer/TrameServer.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack TrameTelemetry/TrameTelemetry.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          # .NET-native codegen trio (discovery JSON = standard contract): Roslyn source generator + server-side export/drift-check.
          dotnet pack Trame.SourceGenerator/Trame.SourceGenerator.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}
          dotnet pack Trame.Server.Codegen/Trame.Server.Codegen.csproj --configuration Release -p:PackageVersion=${{ steps.ver.outputs.VERSION }}

      - name: Publish to NuGet
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish symbol packages
        run: dotnet nuget push "**/*.snupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            **/*.nupkg
            **/*.snupkg