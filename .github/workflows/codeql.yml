# R11.2 (08-08 consolidation roadmap): scheduled CodeQL security analysis over the C#/
# .NET code. Runs on every push to main and weekly — cheap for a repo of this size and
# the only code-scanning that exists here today.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    # Weekly, off-hour Monday minute (deliberately not :00 to avoid the fleet's cron peak).
    - cron: '43 4 * * 1'

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp

      # Pin the SDK so the analysis tracks the solution's target frameworks rather than the
      # runner default: 10.0.x builds both library TFMs (net8.0 + net10.0).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"