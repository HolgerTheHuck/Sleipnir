name: Deploy DevUI (Standalone)

# Builds the Sleipnir DevUI in standalone mode (relative asset base) and deploys
# it as a static site to GitHub Pages. The site lives at the repo Pages URL and
# can point at any Sleipnir-Server via its settings panel.
#
# Prerequisite (manual, one-time): Repo → Settings → Pages → Source = GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'SleipnirDeveloperUi/**'
      - 'clients/ts/**'
      - '.github/workflows/deploy-devui.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-devui
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The DevUI depends on the local TS client packages (file:../clients/ts and
      # file:../clients/codegen). Their dist/ is gitignored, so build them first
      # (clients/ts before clients/codegen, which depends on it).
      - name: Build TS client (clients/ts)
        working-directory: clients/ts
        run: npm install && npm run build

      - name: Build codegen client (clients/codegen)
        working-directory: clients/codegen
        run: npm install && npm run build

      - name: Install DevUI dependencies
        working-directory: SleipnirDeveloperUi
        run: npm ci || npm install

      - name: Build standalone DevUI
        working-directory: SleipnirDeveloperUi
        run: npm run build:standalone

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: SleipnirDeveloperUi/dist-standalone

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5